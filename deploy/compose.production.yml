name: aimall-prod
services:
  mysql:
    image: mysql:8.0.42
    restart: unless-stopped
    mem_limit: 1g
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: ai_mall
      MYSQL_USER: aimall
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci --default-time-zone=+08:00
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 10s
      retries: 15
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 10s
      retries: 10
  minio:
    image: aimall-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ..
      dockerfile: deploy/minio.Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 10s
      retries: 15
  milvus:
    image: milvusdb/milvus:v2.4.9
    restart: unless-stopped
    mem_limit: 2g
    command: [milvus, run, standalone]
    environment:
      ETCD_USE_EMBED: 'true'
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    volumes: [milvus-data:/var/lib/milvus]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 15s
      retries: 20
      start_period: 45s
  ollama:
    image: ollama/ollama:0.40.1
    restart: unless-stopped
    mem_limit: 8g
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '4096'
    volumes: [ollama-data:/root/.ollama]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      retries: 5
  embeddings:
    image: ollama/ollama:0.40.1
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    volumes: [embeddings-data:/root/.ollama]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      retries: 5
  ai-service:
    build: ../ai-service
    restart: unless-stopped
    mem_limit: 1g
    environment:
      LLM_API_BASE: http://ollama:11434/v1
      LLM_API_KEY: ollama
      LLM_CHAT_MODEL: qwen2.5:1.5b
      LLM_INTENT_MODEL: qwen2.5:1.5b
      LLM_REASONING_EFFORT: none
      LLM_CHAT_TIMEOUT_S: '60'
      LLM_INTENT_TIMEOUT_S: '30'
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_MODEL: shaw/dmeta-embedding-zh
      EMBEDDING_DIM: '768'
      OLLAMA_BASE_URL: http://embeddings:11434
      OLLAMA_NUM_GPU: '0'
      OLLAMA_KEEP_ALIVE: 2m
      OLLAMA_NUM_CTX: '2048'
      MILVUS_URI: http://milvus:19530
      MILVUS_COLLECTION: kb_chunks_dmeta_zh_768
      MILVUS_PRODUCT_COLLECTION: product_index_dmeta_zh_768
      BACKEND_BASE_URL: http://backend:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?required}
      RERANKER_ENABLED: 'false'
      PRODUCT_SYNC_ENABLED: 'true'
      PRODUCT_SYNC_INTERVAL_S: '3600'
      LANGFUSE_ENABLED: 'false'
      CHAT_TIMEOUT_S: '180'
    depends_on:
      milvus: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=5)"]
      interval: 20s
      retries: 10
      start_period: 60s
  backend:
    build: ../backend
    hostname: aimall-backend
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_DB: ai_mall
      MYSQL_USERNAME: aimall
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?required}
      SEED_PASSWORD: ${SEED_PASSWORD:?required}
      APP_CORS_ALLOWED_ORIGINS: https://aimall.novo.ccwu.cc
      AI_SERVICE_BASE_URL: http://ai-service:8000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
      KB_BULK_SEED_ENABLED: 'false'
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      SERVER_ERROR_INCLUDE_MESSAGE: never
      SERVER_ERROR_INCLUDE_STACKTRACE: never
      CHAT_RATE_LIMIT: '5'
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      ai-service: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8080/actuator/health | grep UP']
      interval: 20s
      retries: 15
      start_period: 90s
  frontend:
    build:
      context: ../frontend
      args:
        VITE_BASE_PATH: /aimall/
    restart: unless-stopped
    mem_limit: 256m
    ports: ['127.0.0.1:18100:80']
    volumes: ['./frontend.production.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/']
      interval: 20s
      retries: 5
volumes:
  mysql-data:
  redis-data:
  minio-data:
  milvus-data:
  ollama-data:
  embeddings-data:
