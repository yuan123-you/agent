limit_req_zone $binary_remote_addr zone=aimall_auth:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=aimall_chat:10m rate=5r/m;
server {
    listen 80;
    server_name aimall.novo.ccwu.cc;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; try_files $uri =404; }
    location / { return 301 https://aimall.novo.ccwu.cc$request_uri; }
}
server {
    listen 443 ssl;
    server_name aimall.novo.ccwu.cc;
    ssl_certificate /etc/letsencrypt/live/aimall.novo.ccwu.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aimall.novo.ccwu.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    client_max_body_size 25m;
    client_body_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; try_files $uri =404; }
    location ^~ /internal/ { return 404; }
    location ^~ /actuator/ { return 404; }
    location ~* ^/(api/)?(swagger|swagger-ui|v3/api-docs|docs|redoc|openapi.json) { return 404; }
    location ~ /\. { return 404; }
    location /api/v1/auth/ {
        limit_req zone=aimall_auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/aimall-proxy.conf;
    }
    location = /api/v1/chat/messages {
        limit_req zone=aimall_chat burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/aimall-proxy.conf;
    }
    location /api/ {
        include /etc/nginx/snippets/aimall-proxy.conf;
    }
    location = / { return 302 /aimall/; }
    location = /aimall { return 301 /aimall/; }
    location /aimall/api/v1/auth/ {
        limit_req zone=aimall_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18100/api/v1/auth/;
        include /etc/nginx/snippets/aimall-forward-headers.conf;
    }
    location = /aimall/api/v1/chat/messages {
        limit_req zone=aimall_chat burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18100/api/v1/chat/messages;
        include /etc/nginx/snippets/aimall-forward-headers.conf;
    }
    location /aimall/ {
        include /etc/nginx/snippets/aimall-subpath-proxy.conf;
    }
    location / { return 404; }
}
