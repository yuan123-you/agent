name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ---------- backend : JUnit ----------
  backend:
    name: backend (JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run JUnit tests
        run: mvn -B test

  # ---------- frontend : Vitest ----------
  frontend:
    name: frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest
        run: npm test
      - name: Type check
        run: npx tsc --noEmit

  # ---------- ai-service : pytest ----------
  ai-service:
    name: ai-service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest
        run: pytest -q

  # ---------- eval : 生成数据集 + 跑基准线 ----------
  eval:
    name: eval (baseline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate dataset (deterministic, no LLM/Milvus)
        run: python scripts/generate_dataset.py
      - name: Run offline eval baseline
        run: python scripts/run_eval.py --json
      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: eval-baseline
          path: eval/results/baseline.json
          if-no-files-found: error

  # ---------- docker : 构建镜像 + smoke test ----------
  docker-build:
    name: docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ai-service image
        run: docker build -t aimall-smoke:ai ./ai-service
      - name: Smoke test /health/live
        run: |
          docker run -d --name smoke-ai \
            -e LANGFUSE_ENABLED=false -e PRODUCT_SYNC_ENABLED=false \
            -p 8000:8000 aimall-smoke:ai
          ok=""
          for i in $(seq 1 30); do
            if docker exec smoke-ai python -c \
                "import urllib.request;r=urllib.request.urlopen('http://localhost:8000/health/live',timeout=3);assert r.status==200"; then
              ok=1; break
            fi
            sleep 2
          done
          docker rm -f smoke-ai >/dev/null 2>&1 || true
          test -n "$ok"